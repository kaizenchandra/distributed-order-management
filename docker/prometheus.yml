global:
  scrape_interval: 15s
scrape_configs:
  - job_name: oms
    authorization:
      credentials_file: /run/secrets/prometheus_jwt
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'order-service:8080', 'inventory-service:8080', 'payment-service:8080', 'saga-orchestrator:8080', 'order-query-service:8080' ]
