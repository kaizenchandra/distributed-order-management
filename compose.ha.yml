      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1"
      KAFKA_BOOTSTRAP: kafka-a:9092,kafka-b:9092,kafka-c:9092
      KAFKA_TOPIC_REPLICATION: '3'
      KAFKA_TOPIC_MIN_ISR: '2'
    volumes:
      - "./docker/kafka-bootstrap.sh:/bootstrap/kafka-bootstrap.sh:ro"
      - "./docker/kafka.local/cli:/security/cli:ro"
      - "./docker/kafka.local/truststore.p12:/security/truststore.p12:ro"
