---
name: oms
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: "${OMS_DB_PASSWORD:?Run scripts/configure-local.sh}"
      OMS_DB_PASSWORD: "${OMS_DB_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - "./docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 3s
      retries: 40
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command:
      - start-dev
      - "--import-realm"
    environment:
      JAVA_OPTS_APPEND: "-Xms64m -Xmx256m -XX:ActiveProcessorCount=2"
      KC_HOSTNAME: http://localhost:8180
    ports:
      - 127.0.0.1:8180:8080
    volumes:
      - "./docker/realm.local.json:/opt/keycloak/data/import/realm.json:ro"
  order-service:
    build:
      context: "."
      dockerfile: docker/Dockerfile
      args:
        SERVICE: order-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx128m -Xss256k -XX:ActiveProcessorCount=1 -XX:ReservedCodeCacheSize=48m"
      DB_URL: jdbc:postgresql://postgres:5432/order_service
      DB_USER: order_service
      DB_PASSWORD: "${OMS_DB_PASSWORD}"
      KAFKA_BOOTSTRAP: kafka-a:9092,kafka-b:9092,kafka-c:9092
      JWT_ISSUER: http://localhost:8180/realms/oms
      JWT_JWKS: http://keycloak:8080/realms/oms/protocol/openid-connect/certs
      SPRING_CONFIG_IMPORT: file:/run/oms/kafka-client.properties
    ports:
      - 127.0.0.1:8091:8080
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - "./docker/kafka.local/order_service.properties:/run/oms/kafka-client.properties:ro"
      - "./docker/kafka.local/truststore.p12:/run/oms/kafka-truststore.p12:ro"
    healthcheck:
      test:
        - CMD
        - bash
        - "-c"
        - |
          #!/bin/bash
          # No JVM per probe: check the application's HTTP readiness with Bash builtins.
          set -eu
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          IFS= read -r -t 2 status <&3
          case "$$status" in
            *' 200 '*) exit 0 ;;
            *) exit 1 ;;
          esac
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 45s
  inventory-service:
    build:
      context: "."
      dockerfile: docker/Dockerfile
