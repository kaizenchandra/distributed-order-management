  kafka-a:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NODE_ID: '11'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-a:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,CONTROLLER:SASL_SSL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 11@kafka-a:9093,12@kafka-b:9093,13@kafka-c:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m"
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
      KAFKA_OPTS: "-Djava.security.auth.login.config=/security/broker-jaas.conf -XX:ActiveProcessorCount=2"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_SSL_KEYSTORE_LOCATION: "/security/keystore.p12"
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: "/security/truststore.p12"
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      CLUSTER_ID: "${OMS_KAFKA_HA_CLUSTER_ID:?Run configure-kafka-ha.py and set cluster
        ID}"
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
    volumes:
      - kafka_ha_0:/var/lib/kafka/data
      - "./docker/kafka.local/ha/kafka-a.p12:/security/keystore.p12:ro"
      - "./docker/kafka.local/truststore.p12:/security/truststore.p12:ro"
      - "./docker/kafka.local/broker-jaas.conf:/security/broker-jaas.conf:ro"
    env_file:
      - "./docker/kafka.local/broker.env"
    mem_limit: 512m
